name: Android APK

# Build só do Android para o branch cemu-android (o build_check do oficial roda apenas na main).
on:
  push:
    branches:
      - cemu-android
    paths-ignore:
      - "*.md"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Setup vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build Cemu
        env:
          # Mesmos secrets dos outros apps: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS.
          ANDROID_STORE_FILE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          cd ./src/android
          if [[ -n "$ANDROID_STORE_FILE_BASE64" ]]; then
            base64 --decode <<< "${ANDROID_STORE_FILE_BASE64}" > store.jks
            export ANDROID_STORE_FILE=$(pwd)/store.jks
            echo "Assinando com a chave fixa dos secrets."
          else
            echo "Sem KEYSTORE_BASE64: o APK sai com a chave de debug."
          fi
          ./gradlew assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cemu-android
          path: ./src/android/app/build/outputs/apk/*/*.apk
